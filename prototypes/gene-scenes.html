<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Prototype: six compositions for the gene-to-protein scene. Standalone; not part of the app build.
     Published copy: https://claude.ai/artifact/L2ongjuirxyjxpBzRQcqvc
     Open this file directly in a browser (needs internet for three.js and fonts). -->
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gene Scene Compositions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: one-screen viewer. Composition picker on top, the 3D stage fills the rest, caption and transport float on the stage. */
  :root {
    --bg: #0a0e16;
    --panel: #111723;
    --panel-2: #18202f;
    --line: #243045;
    --text: #e6ebf3;
    --dim: #a3afc2;
    --accent: #7dd3fc;
    --ink: #06202e;
    --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-head: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; }
  .app {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  h1 { margin: 0; font-family: var(--font-head); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .picks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .pick {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 14px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text);
    font: 500 14px var(--font-ui); cursor: pointer;
  }
  .pick .n {
    display: inline-grid; place-items: center;
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--panel-2); color: var(--dim);
    font: 600 12px var(--font-head); font-variant-numeric: tabular-nums;
  }
  .pick:hover { border-color: #3a4a66; }
  .pick[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  .pick[aria-pressed="true"] .n { background: rgba(6, 32, 46, 0.16); color: var(--ink); }
  .pick:focus-visible, .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage {
    position: relative; flex: 1; min-height: 300px;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #13203a 0%, #0c1220 55%, #0a0e16 100%);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .caption {
    position: absolute; left: 12px; bottom: 12px;
    max-width: min(440px, calc(100% - 24px));
    padding: 12px 14px; border-radius: 12px;
    background: rgba(17, 23, 35, 0.86); border: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .caption h2 { margin: 0 0 4px; font: 600 16px var(--font-head); }
  .caption p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.5; }
  .tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
  .tool {
    min-width: 44px; height: 44px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: rgba(17, 23, 35, 0.86); color: var(--text);
    font: 500 13px var(--font-ui); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tool:hover { border-color: #3a4a66; }
  .hint { position: absolute; right: 12px; bottom: 12px; color: var(--dim); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--dim); font-size: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  @media (max-width: 640px) {
    .hint { display: none; }
    .caption { bottom: 8px; left: 8px; max-width: calc(100% - 16px); }
  }
</style>

<div class="app">
  <header>
    <h1>Gene → protein: six compositions</h1>
    <p>Same scene, same animation; only the layout and camera change. Drag to look around.</p>
  </header>
  <nav class="picks" id="picks" aria-label="Compositions"></nav>
  <div class="stage" id="stage">
    <div class="tools">
      <button class="tool" id="play" type="button" aria-label="Pause">Pause</button>
      <button class="tool" id="speed" type="button" aria-label="Speed">1×</button>
      <button class="tool" id="reset" type="button">Reset view</button>
    </div>
    <div class="caption" aria-live="polite">
      <h2 id="cap-title"></h2>
      <p id="cap-text"></p>
      <div class="legend" style="margin-top: 8px">
        <span><i style="background: #e8b26a"></i>Water-avoiding</span>
        <span><i style="background: #5eead4"></i>Water-loving</span>
        <span><i style="background: #818cf8"></i>Positive</span>
        <span><i style="background: #f472b6"></i>Negative</span>
      </div>
    </div>
    <span class="hint">Drag to orbit · scroll to zoom</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const STEP = 0.07;               // scene units per base
  const TWIST = (2 * Math.PI) / 10.5;
  const DNA_R = 0.2;
  const PROTEIN_LEN = 110;
  const RES_STEP = 0.085;
  const BASES_PER_SEC = 9;
  const HOLD = 5;                  // seconds the finished protein stays before the loop restarts

  // ---------- Compositions ----------
  function spiralMrna() {
    const P = V(0, 1.7, 0);
    const pts = [P.clone()];
    let rib = null;
    for (let k = 1; k <= 9; k++) {
      const a = k * 0.72, r = 0.35 + k * 0.16, y = 1.55 - k * 0.38;
      pts.push(V(Math.cos(a) * r, y, Math.sin(a) * r));
    }
    rib = pts[pts.length - 1].clone();
    const out = V(rib.x, 0, rib.z).normalize();
    pts.push(rib.clone().add(out.clone().multiplyScalar(1.4)).add(V(0, -0.3, 0)));
    pts.push(rib.clone().add(out.clone().multiplyScalar(3.4)).add(V(0, -0.6, 0)));
    return { pts, rib };
  }
  const spiral = spiralMrna();

  const COMPS = [
    {
      name: 'Flat diagram',
      text: 'Today’s layout: everything side-on, like a textbook figure. DNA runs across the top, mRNA drops down and slides left through the ribosome, and the protein hangs below.',
      dna: [V(-4.6, 1.7, 0), V(4.6, 1.7, 0)], pol: 0.68,
      mrna: [V(1.66, 1.25, 0), V(1.66, 0.35, 0), V(1.3, 0, 0), V(-0.8, 0, 0), V(-5, 0, 0)], rib: V(-0.8, 0, 0),
      up: V(0, 1, 0), grow: V(-0.25, -1, 0.1), foldDist: 1.0,
      cam: V(0, 0.1, 8.6), target: V(0, 0.1, 0), fov: 42, fog: [10, 30],
    },
    {
      name: 'DNA out of the screen',
      text: 'The double helix streams out of the distance and past your shoulder. The polymerase sits just in front of you; the mRNA peels off and dives back into the scene to the ribosome.',
      dna: [V(0.3, 1.0, -14), V(0.3, 1.0, 9.5)], pol: 0.596,
      mrna: [V(0.3, 1.0, 0), V(0.3, 0.4, -0.2), V(-0.6, -0.6, -1.2), V(-1.6, -0.8, -1.8), V(-3.5, -1, -4), V(-6, -1.2, -8)], rib: V(-1.6, -0.8, -1.8),
      up: V(0, 1, 0), grow: V(0.3, -0.8, 0.6), foldDist: 1.0,
      cam: V(2.2, 1.9, 7.6), target: V(-0.4, 0.1, -1.5), fov: 52, fog: [7, 24],
    },
    {
      name: 'Diagonal dive',
      text: 'A low camera looks up as the DNA comes in at a steep angle from the top-left distance. The mRNA sweeps down past you to a ribosome in the foreground.',
      dna: [V(-8, 5, -12), V(2.6, 1.4, 1.8)], pol: 0.8,
      mrna: [V(0.48, 2.12, -0.96), V(0.6, 1.3, -0.6), V(0.9, 0.2, 0.4), V(1.4, -0.6, 1.4), V(3, -1, 0), V(6, -1.4, -3)], rib: V(1.4, -0.6, 1.4),
      up: V(-0.2, 1, 0.2), grow: V(-0.5, -0.7, 0.6), foldDist: 1.0,
      cam: V(-1.2, -1.4, 7.2), target: V(0.4, 0.5, -0.5), fov: 52, fog: [7, 24],
    },
    {
      name: 'Protein into the camera',
      text: 'The ribosome sits centre-stage with the mRNA threading through it. The new protein grows straight towards you and folds up just in front of the lens; the DNA stays small in the background.',
      dna: [V(-5, 2.4, -7), V(6, 2.6, -5)], pol: 0.78,
      mrna: [V(3.58, 2.56, -5.44), V(3.4, 1.6, -4.2), V(2.6, 0.4, -1.5), V(1.6, 0, -0.2), V(0, 0, 0), V(-2, 0, 0.2), V(-5, 0.2, -1)], rib: V(0, 0, 0),
      up: V(0, 1, 0), grow: V(0.05, -0.12, 1), exitOffset: V(0, -0.35, 0.45), foldDist: 1.9,
      cam: V(0.2, 0.35, 5.6), target: V(0, -0.1, 0), fov: 56, fog: [6, 20],
    },
    {
      name: 'Ribosome’s-eye view',
      text: 'You ride on the ribosome. The mRNA runs towards you from a polymerase on the horizon, gets read right under the camera, and the protein spills out to the side.',
      dna: [V(-7, 0.9, -15), V(7, 0.9, -15)], pol: 0.5,
      mrna: [V(0, 0.9, -15), V(0, 0.3, -12), V(0.1, -0.2, -6), V(0, -0.3, -2), V(0, -0.35, 0), V(-0.4, -0.5, 1.5), V(-2.5, -1, 3)], rib: V(0, -0.35, 0),
      up: V(0, 1, 0), grow: V(1, -0.3, 0.3), foldDist: 1.1,
      cam: V(0.9, 0.55, 2.4), target: V(0, -0.2, -5), fov: 62, fog: [6, 30],
    },
    {
      name: 'Orbiting tower',
      text: 'The DNA stands upright like a tower. The mRNA spirals down around it to a ribosome at the base, and the camera slowly circles the whole thing.',
      dna: [V(0, -4.5, 0), V(0, 5.5, 0)], pol: 0.62,
      mrna: spiral.pts, rib: spiral.rib,
      up: V(0, 1, 0), grow: V(0, -1, 0.2), foldDist: 1.0,
      cam: V(0, 1.4, 8.5), target: V(0, 0.2, 0), fov: 46, fog: [9, 26], orbit: 0.16,
    },
  ];

  // ---------- Sequence and protein ----------
  let seed = 7;
  const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const SEQ = Array.from({ length: 4096 }, () => 'ACGT'[Math.floor(rand() * 4)]);
  const seqAt = (i) => SEQ[((i % SEQ.length) + SEQ.length) % SEQ.length];
  const BASE_COL = { A: 0x34d399, C: 0x60a5fa, G: 0xfbbf24, T: 0xf87171, U: 0xf87171 };
  const CLASS_COLS = [0xe8b26a, 0x5eead4, 0x818cf8, 0xf472b6];
  const RES_COL = Array.from({ length: PROTEIN_LEN }, () => {
    const r = rand();
    return CLASS_COLS[r < 0.38 ? 0 : r < 0.72 ? 1 : r < 0.86 ? 2 : 3];
  });

  // A compact folded shape: a persistent random walk kept inside a small sphere, with helical stretches.
  const FOLD = (() => {
    const out = [];
    let p = V(0, 0, 0), d = V(1, 0.2, 0).normalize();
    const R = 0.62;
    for (let i = 0; i < PROTEIN_LEN; i++) {
      d.add(V(rand() - 0.5, rand() - 0.5, rand() - 0.5).multiplyScalar(0.7)).normalize();
      const next = p.clone().add(d.clone().multiplyScalar(RES_STEP));
      if (next.length() > R) d.sub(p.clone().multiplyScalar(2.2)).normalize();
      p = p.clone().add(d.clone().multiplyScalar(RES_STEP));
      out.push(p.clone());
    }
    // helical stretches: coil residues around the walk
    for (let i = 0; i < PROTEIN_LEN; i++) {
      if (Math.floor(i / 14) % 2 === 0) {
        const a = i * 1.75;
        out[i].add(V(Math.cos(a), Math.sin(a), Math.sin(a * 0.5)).multiplyScalar(0.06));
      }
    }
    const c = out.reduce((s, q) => s.add(q), V(0, 0, 0)).multiplyScalar(1 / out.length);
    return out.map((q) => q.sub(c));
  })();

  // ---------- Three.js setup ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setClearColor(0x000000, 0);
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b1220, 10, 30);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 80);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.25); key.position.set(3, 6, 8); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8ab4ff, 0.8); rim.position.set(-6, -4, -6); scene.add(rim);

  const sphereGeo = new THREE.SphereGeometry(1, 14, 10);
  const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1);
  const inst = (geo, n) => {
    const m = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.05 }), n);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.setColorAt(0, new THREE.Color(0xffffff));
    m.frustumCulled = false;
    scene.add(m);
    return m;
  };
  const MAX_DNA = 640;
  const dnaBalls = inst(sphereGeo, MAX_DNA * 2);
  const dnaRungs = inst(cylGeo, MAX_DNA);
  const mrnaBeads = inst(sphereGeo, 480);
  const protBeads = inst(sphereGeo, PROTEIN_LEN);

  const blob = (color, opacity, glow) => {
    const m = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: glow, roughness: 0.6, transparent: true, opacity, depthWrite: false, fog: false,
    }));
    m.renderOrder = 2;
    scene.add(m);
    return m;
  };
  const polymerase = blob(0xa78bfa, 0.3, 0.45);
  const ribSmall = blob(0xfde4b8, 0.4, 0.75);
  const ribLarge = blob(0xfcd9a0, 0.36, 0.75);

  // ---------- Per-composition geometry ----------
  let C, curve, curveLen, ribArc, P, du, dv, dw, dnaLen, exit, foldCenter, growDir, gPerp1, gPerp2;
  function setup(comp) {
    C = comp;
    const [a, b] = C.dna;
    dnaLen = a.distanceTo(b);
    du = b.clone().sub(a).normalize();
    const ref = Math.abs(du.y) < 0.9 ? V(0, 1, 0) : V(1, 0, 0);
    dv = du.clone().cross(ref).normalize();
    dw = du.clone().cross(dv).normalize();
    P = a.clone().lerp(b, C.pol);
    polymerase.position.copy(P);
    polymerase.scale.setScalar(0.5);

    const pts = [P.clone(), ...C.mrna.filter((q, i) => i > 0 || q.distanceTo(P) > 0.05)];
    curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    curveLen = curve.getLength();
    let best = Infinity;
    for (let k = 0; k <= 600; k++) {
      const d = curve.getPointAt(k / 600).distanceTo(C.rib);
      if (d < best) { best = d; ribArc = (k / 600) * curveLen; }
    }

    // ribosome orientation: x along the mRNA, y up
    const t = curve.getTangentAt(ribArc / curveLen).normalize();
    const y = C.up.clone().sub(t.clone().multiplyScalar(C.up.dot(t))).normalize();
    const z = t.clone().cross(y).normalize();
    const basis = new THREE.Matrix4().makeBasis(t, y, z);
    const q = new THREE.Quaternion().setFromRotationMatrix(basis);
    ribSmall.position.copy(C.rib).add(y.clone().multiplyScalar(0.3));
    ribSmall.quaternion.copy(q); ribSmall.scale.set(0.62, 0.3, 0.5);
    ribLarge.position.copy(C.rib).add(y.clone().multiplyScalar(-0.45));
    ribLarge.quaternion.copy(q); ribLarge.scale.set(0.75, 0.48, 0.62);

    exit = C.exitOffset ? C.rib.clone().add(C.exitOffset) : C.rib.clone().add(y.clone().multiplyScalar(-0.85));
    growDir = C.grow.clone().normalize();
    const r2 = Math.abs(growDir.y) < 0.9 ? V(0, 1, 0) : V(1, 0, 0);
    gPerp1 = growDir.clone().cross(r2).normalize();
    gPerp2 = growDir.clone().cross(gPerp1).normalize();
    foldCenter = exit.clone().add(growDir.clone().multiplyScalar(C.foldDist));

    scene.fog.near = C.fog[0];
    scene.fog.far = C.fog[1];
    pos = ribArc / STEP - 4; // start with the mRNA just reaching the ribosome
    hold = 0;
  }

  // ---------- Camera ----------
  let yaw = 0, pitch = 0, zoom = 1, orbitAngle = 0;
  const camPos = V(0, 0, 9), camTarget = V(0, 0, 0);
  let camFov = 45;
  function desiredCamera() {
    const off = C.cam.clone().sub(C.target);
    const right = off.clone().cross(V(0, 1, 0)).normalize();
    off.applyAxisAngle(right, pitch);
    off.applyAxisAngle(V(0, 1, 0), yaw + orbitAngle);
    off.multiplyScalar(zoom);
    return { pos: C.target.clone().add(off), target: C.target.clone() };
  }

  // ---------- Animation ----------
  let pos = 0, hold = 0, playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, speed = 1;
  const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), s4 = V(1, 1, 1), col = new THREE.Color();
  const tmpA = V(0, 0, 0), tmpB = V(0, 0, 0), UPY = V(0, 1, 0);
  const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

  function place(mesh, i, p, r) { m4.compose(p, q4.identity(), s4.setScalar(r)); mesh.setMatrixAt(i, m4); }
  function cylinder(mesh, i, a, b, r) {
    const len = a.distanceTo(b);
    if (len < 1e-5) { m4.makeScale(0, 0, 0); mesh.setMatrixAt(i, m4); return; }
    tmpA.copy(b).sub(a).normalize();
    q4.setFromUnitVectors(UPY, tmpA);
    m4.compose(tmpB.copy(a).add(b).multiplyScalar(0.5), q4, s4.set(r, len, r));
    mesh.setMatrixAt(i, m4);
  }

  function drawDna() {
    const sMin = -C.pol * dnaLen, sMax = (1 - C.pol) * dnaLen;
    const i0 = Math.floor(pos - sMax / STEP), i1 = Math.ceil(pos - sMin / STEP);
    let n = 0;
    for (let i = i0; i <= i1 && n < MAX_DNA; i++, n++) {
      const s = (pos - i) * STEP;
      const edge = Math.min(s - sMin, sMax - s);
      const fade = smooth(0, 0.9, edge);
      const open = 1 - smooth(0.28, 0.46, Math.abs(s));
      const r = DNA_R * (1 + open * 0.9);
      const th = i * TWIST;
      const c = P.clone().add(du.clone().multiplyScalar(s));
      const pa = c.clone().add(dv.clone().multiplyScalar(Math.cos(th) * r)).add(dw.clone().multiplyScalar(Math.sin(th) * r));
      const pb = c.clone().add(dv.clone().multiplyScalar(Math.cos(th + 2.4) * r)).add(dw.clone().multiplyScalar(Math.sin(th + 2.4) * r));
      place(dnaBalls, 2 * n, pa, 0.045 * fade);
      place(dnaBalls, 2 * n + 1, pb, 0.045 * fade);
      dnaBalls.setColorAt(2 * n, col.setHex(0xa5b4cf));
      dnaBalls.setColorAt(2 * n + 1, col.setHex(0x7f8db0));
      if (open > 0.3 || fade <= 0) { m4.makeScale(0, 0, 0); dnaRungs.setMatrixAt(n, m4); }
      else cylinder(dnaRungs, n, pa, pb, 0.017 * fade);
      dnaRungs.setColorAt(n, col.setHex(BASE_COL[seqAt(i)]));
    }
    dnaBalls.count = n * 2;
    dnaRungs.count = n;
  }

  function drawMrna() {
    const readBase = pos - ribArc / STEP;
    const codonStart = Math.floor(readBase / 3) * 3;
    let n = 0;
    const jMax = Math.floor(pos), jMin = Math.ceil(pos - curveLen / STEP);
    for (let j = Math.max(0, jMin); j <= jMax && n < 480; j++) {
      const arc = (pos - j) * STEP;
      if (arc < 0 || arc > curveLen) continue;
      const p = curve.getPointAt(arc / curveLen);
      const reading = j >= codonStart && j < codonStart + 3;
      const tailFade = smooth(0, 1.2, curveLen - arc);
      place(mrnaBeads, n, p, (reading ? 0.06 : 0.035) * tailFade);
      col.setHex(BASE_COL[seqAt(j)]);
      if (reading) col.lerp(new THREE.Color(0xffffff), 0.45);
      mrnaBeads.setColorAt(n, col);
      n++;
    }
    mrnaBeads.count = n;
  }

  function drawProtein(time) {
    const readBase = pos - ribArc / STEP;
    const made = Math.max(0, Math.min(PROTEIN_LEN, Math.floor(readBase / 3)));
    const spin = new THREE.Quaternion().setFromAxisAngle(growDir, time * 0.25);
    for (let i = 0; i < made; i++) {
      const age = made - 1 - i + hold * 14;
      const f = smooth(3, 30, age);
      const ext = exit.clone()
        .add(growDir.clone().multiplyScalar(0.05 + Math.min(age, 40) * RES_STEP))
        .add(gPerp1.clone().multiplyScalar(Math.sin(age * 0.9) * 0.03))
        .add(gPerp2.clone().multiplyScalar(Math.cos(age * 0.7) * 0.03));
      const folded = FOLD[i].clone().applyQuaternion(spin).add(foldCenter);
      const p = ext.lerp(folded, f);
      const newest = i === made - 1 && hold === 0;
      place(protBeads, i, p, newest ? 0.075 : 0.052);
      col.setHex(RES_COL[i]);
      if (newest) col.lerp(new THREE.Color(0xffffff), 0.5);
      protBeads.setColorAt(i, col);
    }
    protBeads.count = made;
    return made;
  }

  // ---------- Loop ----------
  let last = performance.now(), time = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      time += dt * speed;
      const made = Math.floor((pos - ribArc / STEP) / 3);
      if (made >= PROTEIN_LEN) {
        hold += dt * speed;
        if (hold > HOLD) { pos = ribArc / STEP - 4; hold = 0; }
      } else pos += dt * speed * BASES_PER_SEC;
      if (C.orbit) orbitAngle += dt * C.orbit * speed;
    }
    drawDna();
    drawMrna();
    drawProtein(time);
    for (const m of [dnaBalls, dnaRungs, mrnaBeads, protBeads]) {
      m.instanceMatrix.needsUpdate = true;
      if (m.instanceColor) m.instanceColor.needsUpdate = true;
    }
    const want = desiredCamera();
    const k = 1 - Math.exp(-dt * 4);
    camPos.lerp(want.pos, k);
    camTarget.lerp(want.target, k);
    camFov += (C.fov - camFov) * k;
    camera.position.copy(camPos);
    camera.lookAt(camTarget);
    camera.fov = camFov;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function resize() {
    const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);

  // ---------- Controls ----------
  const picks = document.getElementById('picks');
  const capTitle = document.getElementById('cap-title');
  const capText = document.getElementById('cap-text');
  function choose(i) {
    setup(COMPS[i]);
    yaw = 0; pitch = 0; zoom = 1; orbitAngle = 0;
    capTitle.textContent = `${i + 1} · ${COMPS[i].name}`;
    capText.textContent = COMPS[i].text;
    for (const b of picks.children) b.setAttribute('aria-pressed', String(Number(b.dataset.i) === i));
    try { localStorage.setItem('gene-scenes:pick', String(i)); } catch (e) { /* not remembered */ }
  }
  COMPS.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.dataset.i = String(i);
    b.innerHTML = `<span class="n">${i + 1}</span>`;
    b.append(document.createTextNode(c.name));
    b.addEventListener('click', () => choose(i));
    picks.append(b);
  });

  const playBtn = document.getElementById('play');
  const syncPlay = () => { playBtn.textContent = playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); };
  playBtn.addEventListener('click', () => { playing = !playing; syncPlay(); });
  const speeds = [0.5, 1, 2];
  const speedBtn = document.getElementById('speed');
  speedBtn.addEventListener('click', () => {
    speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
    speedBtn.textContent = `${speed}×`;
  });
  document.getElementById('reset').addEventListener('click', () => { yaw = 0; pitch = 0; zoom = 1; orbitAngle = 0; });

  const canvas = renderer.domElement;
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    yaw -= (e.clientX - drag.x) * 0.006;
    pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - drag.y) * 0.006));
    drag = { x: e.clientX, y: e.clientY };
  });
  const endDrag = () => (drag = null);
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom = Math.max(0.4, Math.min(2.2, zoom * Math.exp(e.deltaY * 0.001)));
  }, { passive: false });

  let start = 0;
  try { start = Math.min(COMPS.length - 1, Math.max(0, Number(localStorage.getItem('gene-scenes:pick')) || 0)); } catch (e) { start = 0; }
  choose(start);
  const first = desiredCamera();
  camPos.copy(first.pos); camTarget.copy(first.target); camFov = C.fov;
  syncPlay();
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
