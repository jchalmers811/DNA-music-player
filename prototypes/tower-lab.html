<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Prototype: tower lab, the wiggly-supercoil orbiting tower with a black hole, three ribosome looks and a
     protein-grows-up (textbook) option. Standalone; not part of the app build.
     Published copy: https://claude.ai/artifact/8EQD3r7RzFx4yFW8159ZfU
     Open this file directly in a browser (needs internet for three.js and fonts). -->
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tower Scene Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: one-screen viewer. Control rows on top, the 3D stage fills the rest, caption and transport float on it. */
  :root {
    --bg: #0a0e16;
    --panel: #111723;
    --line: #243045;
    --text: #e6ebf3;
    --dim: #a3afc2;
    --accent: #7dd3fc;
    --ink: #06202e;
    --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-head: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; }
  .app {
    height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 10px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  h1 { margin: 0; font-family: var(--font-head); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  .group { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; align-items: center; }
  .group-label { color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-right: 2px; flex-shrink: 0; }
  .pick, .toggle {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: 500 14px var(--font-ui); cursor: pointer;
  }
  .pick:hover, .toggle:hover { border-color: #3a4a66; }
  .pick[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  .toggle .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--dim); box-sizing: border-box; }
  .toggle[aria-pressed="true"] { border-color: var(--accent); }
  .toggle[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); }
  .pick:focus-visible, .toggle:focus-visible, .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage {
    position: relative; flex: 1; min-height: 300px;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #13203a 0%, #0c1220 55%, #0a0e16 100%);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .caption {
    position: absolute; left: 12px; bottom: 12px;
    max-width: min(460px, calc(100% - 24px));
    padding: 12px 14px; border-radius: 12px;
    background: rgba(17, 23, 35, 0.86); border: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .caption h2 { margin: 0 0 4px; font: 600 16px var(--font-head); }
  .caption p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.5; }
  .tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
  .tool {
    min-width: 44px; height: 44px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(17, 23, 35, 0.86); color: var(--text);
    font: 500 13px var(--font-ui); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tool:hover { border-color: #3a4a66; }
  .hint { position: absolute; right: 12px; bottom: 12px; color: var(--dim); font-size: 12px; }
  @media (max-width: 640px) {
    .hint { display: none; }
    .caption { bottom: 8px; left: 8px; max-width: calc(100% - 16px); }
  }
</style>

<div class="app">
  <header>
    <h1>Tower lab: wiggly supercoil</h1>
    <p>Starts from the “Everything” combo. Change one thing at a time. Drag to look around.</p>
  </header>
  <div class="bar">
    <div class="group" role="group" aria-label="Ribosome look">
      <span class="group-label">Ribosome</span>
      <button type="button" class="pick" data-rib="simple">Simple</button>
      <button type="button" class="pick" data-rib="realistic">Realistic</button>
      <button type="button" class="pick" data-rib="stylised">Stylised</button>
    </div>
    <div class="group" role="group" aria-label="Protein direction">
      <span class="group-label">Protein</span>
      <button type="button" class="pick" data-dir="down">Grows down</button>
      <button type="button" class="pick" data-dir="up">Grows up (textbook)</button>
    </div>
  </div>
  <div class="bar">
    <div class="group" role="group" aria-label="Scene extras">
      <span class="group-label">Extras</span>
      <button type="button" class="toggle" id="t-hole" aria-pressed="false"><span class="dot"></span>Black hole at the top</button>
      <button type="button" class="toggle" id="t-floor" aria-pressed="false"><span class="dot"></span>Glowing floor</button>
      <button type="button" class="toggle" id="t-blocks" aria-pressed="false"><span class="dot"></span>Drifting building blocks</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="tools">
      <button class="tool" id="play" type="button">Pause</button>
      <button class="tool" id="speed" type="button" aria-label="Speed">1×</button>
      <button class="tool" id="reset" type="button">Reset view</button>
    </div>
    <div class="caption" aria-live="polite">
      <h2 id="cap-title"></h2>
      <p id="cap-text"></p>
    </div>
    <span class="hint">Drag to orbit · scroll to zoom</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const STEP = 0.07;
  const TWIST = (2 * Math.PI) / 10.5;
  const DNA_R = 0.2;
  const PROTEIN_LEN = 110;
  const RES_STEP = 0.085;
  const BASES_PER_SEC = 9;
  const HOLD = 5;
  const Y_P = 1.7, Y_BOTTOM = -4.5, Y_TOP = 5.5;
  const HOLE_Y = Y_TOP + 0.2;
  const P = V(0, Y_P, 0);
  const UP = V(0, 1, 0);
  const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

  // ---------- DNA: wiggly supercoil ----------
  function supercoil(s, t) {
    const y = Y_P + s, R = 0.75 * smooth(0.4, 1.8, Math.abs(s));
    const ph = (s > 0 ? 1.7 : -1.7) * s + 0.5 * t;
    return V(R * Math.cos(ph), y, R * Math.sin(ph));
  }
  function wiggleAt(y, t) {
    const a = smooth(0.3, 1.6, Math.abs(y - Y_P));
    return V(a * 0.6 * Math.sin(1.1 * y - 1.4 * t), 0, a * 0.5 * Math.cos(0.8 * y - 1.0 * t + 1));
  }

  // ---------- Sequence and protein ----------
  let seed = 7;
  const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const SEQ = Array.from({ length: 4096 }, () => 'ACGT'[Math.floor(rand() * 4)]);
  const seqAt = (i) => SEQ[((i % SEQ.length) + SEQ.length) % SEQ.length];
  const BASE_COL = { A: 0x34d399, C: 0x60a5fa, G: 0xfbbf24, T: 0xf87171 };
  const BASE_COLS = [0x34d399, 0x60a5fa, 0xfbbf24, 0xf87171];
  const CLASS_COLS = [0xe8b26a, 0x5eead4, 0x818cf8, 0xf472b6];
  const RES_COL = Array.from({ length: PROTEIN_LEN }, () => {
    const r = rand();
    return CLASS_COLS[r < 0.38 ? 0 : r < 0.72 ? 1 : r < 0.86 ? 2 : 3];
  });
  const FOLD = (() => {
    const out = [];
    let p = V(0, 0, 0), d = V(1, 0.2, 0).normalize();
    for (let i = 0; i < PROTEIN_LEN; i++) {
      d.add(V(rand() - 0.5, rand() - 0.5, rand() - 0.5).multiplyScalar(0.7)).normalize();
      if (p.clone().add(d.clone().multiplyScalar(RES_STEP)).length() > 0.62) d.sub(p.clone().multiplyScalar(2.2)).normalize();
      p = p.clone().add(d.clone().multiplyScalar(RES_STEP));
      out.push(p.clone());
    }
    for (let i = 0; i < PROTEIN_LEN; i++) {
      if (Math.floor(i / 14) % 2 === 0) {
        const a = i * 1.75;
        out[i].add(V(Math.cos(a), Math.sin(a), Math.sin(a * 0.5)).multiplyScalar(0.06));
      }
    }
    const c = out.reduce((s, q) => s.add(q), V(0, 0, 0)).multiplyScalar(1 / out.length);
    return out.map((q) => q.sub(c));
  })();

  // ---------- Three.js setup ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setClearColor(0x000000, 0);
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b1220, 11, 28);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 80);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.25); key.position.set(3, 6, 8); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8ab4ff, 0.8); rim.position.set(-6, -4, -6); scene.add(rim);
  const floorLight = new THREE.PointLight(0x7dd3fc, 0, 7); floorLight.position.set(0, -4, 0); scene.add(floorLight);
  const holeLight = new THREE.PointLight(0xa78bfa, 0, 7); holeLight.position.set(0, Y_TOP - 0.6, 0); scene.add(holeLight);

  const sphereGeo = new THREE.SphereGeometry(1, 14, 10);
  const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1);
  const inst = (geo, n, mat) => {
    const m = new THREE.InstancedMesh(geo, mat || new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.05 }), n);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.setColorAt(0, new THREE.Color(0xffffff));
    m.frustumCulled = false;
    scene.add(m);
    return m;
  };
  const MAX_DNA = 700;
  const dnaBalls = inst(sphereGeo, MAX_DNA * 2);
  const dnaRungs = inst(cylGeo, MAX_DNA);
  const mrnaBeads = inst(sphereGeo, 480);
  const protBeads = inst(sphereGeo, PROTEIN_LEN);

  const polymerase = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({
    color: 0xa78bfa, emissive: 0xa78bfa, emissiveIntensity: 0.45, roughness: 0.6, transparent: true, opacity: 0.3, depthWrite: false, fog: false,
  }));
  polymerase.renderOrder = 2;
  polymerase.position.copy(P);
  polymerase.scale.setScalar(0.5);
  scene.add(polymerase);

  // ---------- Radial glow textures (floor and black hole mirror each other) ----------
  function radialTexture(stops, rings) {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    for (const [at, color] of stops) grad.addColorStop(at, color);
    g.fillStyle = grad;
    g.fillRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(165, 220, 252, 0.28)';
    g.lineWidth = 1.2;
    for (const r of rings) { g.beginPath(); g.arc(128, 128, r, 0, Math.PI * 2); g.stroke(); }
    return new THREE.CanvasTexture(c);
  }

  // Glowing floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(5.5, 64),
    new THREE.MeshBasicMaterial({
      map: radialTexture([[0, 'rgba(125, 211, 252, 0.55)'], [0.35, 'rgba(56, 150, 220, 0.22)'], [1, 'rgba(10, 14, 22, 0)']], [34, 64, 94]),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    }),
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = Y_BOTTOM - 0.05;
  scene.add(floor);

  // Black hole: a dark core, a swirling bright ring around it, and the same faint rings as the floor, facing down.
  const hole = new THREE.Group();
  hole.position.y = HOLE_Y;
  scene.add(hole);
  const swirlTex = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(256, 256, 60, 256, 256, 256);
    grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
    grad.addColorStop(0.05, 'rgba(240, 236, 255, 0.95)');
    grad.addColorStop(0.18, 'rgba(167, 139, 250, 0.7)');
    grad.addColorStop(0.45, 'rgba(56, 150, 220, 0.28)');
    grad.addColorStop(1, 'rgba(10, 14, 22, 0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 512, 512);
    // spiral streaks
    g.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 14; k++) {
      g.beginPath();
      for (let s = 0; s <= 1; s += 0.02) {
        const r = 64 + s * 190, a = (k / 14) * Math.PI * 2 + s * 3.2;
        const x = 256 + Math.cos(a) * r, y = 256 + Math.sin(a) * r;
        s === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.strokeStyle = `rgba(200, 190, 255, ${0.16 + (k % 3) * 0.05})`;
      g.lineWidth = 3;
      g.stroke();
    }
    return new THREE.CanvasTexture(c);
  })();
  const disk = new THREE.Mesh(
    new THREE.RingGeometry(0.55, 3.4, 96, 1),
    new THREE.MeshBasicMaterial({ map: swirlTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false }),
  );
  disk.rotation.x = Math.PI / 2;
  hole.add(disk);
  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(5.5, 64),
    new THREE.MeshBasicMaterial({
      map: radialTexture([[0, 'rgba(10, 14, 22, 0)'], [0.2, 'rgba(125, 140, 252, 0.25)'], [0.45, 'rgba(56, 150, 220, 0.12)'], [1, 'rgba(10, 14, 22, 0)']], [34, 64, 94]),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    }),
  );
  halo.rotation.x = Math.PI / 2;
  halo.position.y = 0.02;
  hole.add(halo);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 20), new THREE.MeshBasicMaterial({ color: 0x000000, fog: false }));
  hole.add(core);
  hole.visible = false;

  // Drifting building blocks (free nucleotides)
  const BLOCKS = 280;
  const blockMesh = inst(sphereGeo, BLOCKS, new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.05, emissive: 0x111111 }));
  const blocks = Array.from({ length: BLOCKS }, (_, k) => ({ p: V(0, 0, 0), v: V(0, 0, 0), col: BASE_COLS[k % 4], life: 1 }));
  const spawn = (b, anywhere) => {
    const a = rand() * Math.PI * 2, r = anywhere ? 0.8 + rand() * 5.5 : 4 + rand() * 2.5;
    b.p.set(Math.cos(a) * r, Y_BOTTOM + 0.3 + rand() * (Y_TOP - Y_BOTTOM), Math.sin(a) * r);
    b.v.set(rand() - 0.5, rand() - 0.5, rand() - 0.5).multiplyScalar(0.15);
    b.life = 1;
  };
  blocks.forEach((b) => spawn(b, true));

  // ---------- mRNA spiral ----------
  const mrnaPts = [P.clone()];
  for (let k = 1; k <= 9; k++) {
    const a = k * 0.72, r = 0.45 + k * 0.17, y = 1.55 - k * 0.38;
    mrnaPts.push(V(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  const RIB = mrnaPts[mrnaPts.length - 1].clone();
  const outward = V(RIB.x, 0, RIB.z).normalize();
  mrnaPts.push(RIB.clone().add(outward.clone().multiplyScalar(1.4)).add(V(0, -0.3, 0)));
  mrnaPts.push(RIB.clone().add(outward.clone().multiplyScalar(3.4)).add(V(0, -0.6, 0)));
  const curve = new THREE.CatmullRomCurve3(mrnaPts, false, 'centripetal');
  const curveLen = curve.getLength();
  let ribArc = 0;
  { let best = Infinity; for (let k = 0; k <= 600; k++) { const d = curve.getPointAt(k / 600).distanceTo(RIB); if (d < best) { best = d; ribArc = (k / 600) * curveLen; } } }
  const tan = curve.getTangentAt(ribArc / curveLen).normalize();
  const ry = UP.clone().sub(tan.clone().multiplyScalar(UP.dot(tan))).normalize();
  const rz = tan.clone().cross(ry).normalize();
  const ribQ = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(tan, ry, rz));
  /** Ribosome-local point (x along the mRNA, y up, z across) to world. */
  const ribLocal = (x, y, z) => RIB.clone().add(tan.clone().multiplyScalar(x)).add(ry.clone().multiplyScalar(y)).add(rz.clone().multiplyScalar(z));

  // ---------- Ribosome looks ----------
  // Every look has a small and a large subunit. `side` puts the large one below the mRNA (+1 = textbook: large on top).
  const SMALL = { r: V(0.62, 0.3, 0.5), y: 0.3 };
  const LARGE = { r: V(0.75, 0.48, 0.62), y: 0.45 };

  // Simple: two soft translucent blobs (today's look)
  const simpleMat = (color) => new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.75, roughness: 0.6, transparent: true, opacity: 0.38, depthWrite: false, fog: false,
  });
  const simpleSmall = new THREE.Mesh(sphereGeo, simpleMat(0xfde4b8));
  const simpleLarge = new THREE.Mesh(sphereGeo, simpleMat(0xfcd9a0));
  for (const m of [simpleSmall, simpleLarge]) { m.renderOrder = 2; m.quaternion.copy(ribQ); scene.add(m); }

  // Realistic: lumpy space-filling clusters of RNA (tan) and protein (slate) with a channel for the mRNA
  const realSmall = inst(sphereGeo, 110, new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0 }));
  const realLarge = inst(sphereGeo, 200, new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0 }));
  function fillCluster(mesh, n, radii, centreY, seedBase) {
    let s = seedBase;
    const r2 = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    let k = 0;
    for (let tries = 0; k < n && tries < n * 20; tries++) {
      const u = V(r2() * 2 - 1, r2() * 2 - 1, r2() * 2 - 1);
      if (u.length() > 1 || u.length() < 0.35) continue;
      const lx = u.x * radii.x, ly = u.y * radii.y + centreY, lz = u.z * radii.z;
      if (Math.abs(ly) < 0.11 && Math.abs(lz) < 0.2) continue; // the mRNA channel
      const size = 0.07 + r2() * 0.08;
      const protein = r2() < 0.33;
      const m = new THREE.Matrix4().compose(ribLocal(lx, ly, lz), new THREE.Quaternion(), V(size, size, size));
      mesh.setMatrixAt(k, m);
      mesh.setColorAt(k, new THREE.Color(protein ? 0x8fa3c7 : (r2() < 0.5 ? 0xd9b98c : 0xc9a476)));
      k++;
    }
    mesh.count = k;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  }

  // Stylised: faceted shapes with glowing edges that pulse on every codon
  const facet = new THREE.IcosahedronGeometry(1, 1);
  const edges = new THREE.EdgesGeometry(facet, 1);
  const styl = (color) => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(facet, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35, roughness: 0.35, flatShading: true, transparent: true, opacity: 0.88 })));
    g.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })));
    g.quaternion.copy(ribQ);
    scene.add(g);
    return g;
  };
  const stylSmall = styl(0x2dd4bf);
  const stylLarge = styl(0xf59e0b);

  let ribStyle = 'simple', grow = 'down';
  let exit, growDir, gPerp1, gPerp2, foldCenter;
  function setupRibosome() {
    const side = grow === 'up' ? 1 : -1; // where the large subunit sits relative to the mRNA
    const smallY = -side * SMALL.y, largeY = side * LARGE.y;
    simpleSmall.position.copy(ribLocal(0, smallY, 0)); simpleSmall.scale.copy(SMALL.r);
    simpleLarge.position.copy(ribLocal(0, largeY, 0)); simpleLarge.scale.copy(LARGE.r);
    stylSmall.position.copy(ribLocal(0, smallY, 0)); stylSmall.scale.copy(SMALL.r);
    stylLarge.position.copy(ribLocal(0, largeY, 0)); stylLarge.scale.copy(LARGE.r);
    fillCluster(realSmall, 110, SMALL.r, smallY, 11);
    fillCluster(realLarge, 200, LARGE.r, largeY, 23);
    for (const m of [simpleSmall, simpleLarge]) m.visible = ribStyle === 'simple';
    for (const m of [realSmall, realLarge]) m.visible = ribStyle === 'realistic';
    for (const m of [stylSmall, stylLarge]) m.visible = ribStyle === 'stylised';

    // The protein leaves through the large subunit's exit tunnel.
    exit = ribLocal(0, side * 0.85, 0);
    growDir = grow === 'up'
      ? V(outward.x * 0.45, 1, outward.z * 0.45).normalize()
      : V(outward.x * 0.3, -1, outward.z * 0.3).normalize();
    gPerp1 = growDir.clone().cross(V(1, 0, 0)).normalize();
    gPerp2 = growDir.clone().cross(gPerp1).normalize();
    foldCenter = exit.clone().add(growDir.clone().multiplyScalar(1.0));
  }

  // ---------- State ----------
  let pos = ribArc / STEP - 4, hold = 0, time = 0, pulse = 0, lastCodon = -1;
  let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, speed = 1;
  let yaw = 0, pitch = 0, zoom = 1, orbitAngle = 0;
  const CAM = V(0, 1.4, 13.4), TARGET = V(0, 0.6, 0);

  // ---------- Helpers ----------
  const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), s4 = V(1, 1, 1), col = new THREE.Color(), white = new THREE.Color(0xffffff);
  const tmpA = V(0, 0, 0), tmpB = V(0, 0, 0);
  function place(mesh, i, p, r) { m4.compose(p, q4.identity(), s4.setScalar(r)); mesh.setMatrixAt(i, m4); }
  function hideAt(mesh, i) { m4.makeScale(0, 0, 0); mesh.setMatrixAt(i, m4); }
  function cylinder(mesh, i, a, b, r) {
    const len = a.distanceTo(b);
    if (len < 1e-5) return hideAt(mesh, i);
    tmpA.copy(b).sub(a).normalize();
    q4.setFromUnitVectors(UP, tmpA);
    m4.compose(tmpB.copy(a).add(b).multiplyScalar(0.5), q4, s4.set(r, len, r));
    mesh.setMatrixAt(i, m4);
  }
  const holeOn = () => hole.visible;
  /** 0 below the black hole's reach, rising to 1 at the event horizon. */
  const pull = (y) => (holeOn() ? smooth(Y_TOP - 2.6, HOLE_Y, y) : 0);

  // ---------- DNA ----------
  function drawDna(t) {
    const line = [];
    const iTop = Math.floor(pos - (Y_TOP - Y_P) / STEP);
    const iBottom = Math.ceil(pos + (Y_P - Y_BOTTOM) / STEP);
    for (let i = iTop; i <= iBottom && line.length < MAX_DNA; i++) {
      const s = (pos - i) * STEP;
      const c = supercoil(s, t).add(wiggleAt(Y_P + s, t));
      // Near the black hole the strand is drawn in to the axis and swirled.
      const k = pull(c.y);
      if (k > 0) {
        c.x *= 1 - 0.92 * k; c.z *= 1 - 0.92 * k;
        const a = k * k * (4 + t * 1.5);
        const x = c.x * Math.cos(a) - c.z * Math.sin(a), z = c.x * Math.sin(a) + c.z * Math.cos(a);
        c.x = x; c.z = z;
      }
      line.push({ i, s, c, k });
    }
    const n = line.length;
    const tangents = line.map((b, j) => line[Math.min(n - 1, j + 1)].c.clone().sub(line[Math.max(0, j - 1)].c).normalize());
    let k0 = line.findIndex((b) => b.s <= 0);
    if (k0 < 0) k0 = n - 1;
    const normals = new Array(n);
    normals[k0] = tangents[k0].clone().cross(V(1, 0, 0)).normalize();
    const carry = (from, to) => {
      const q = new THREE.Quaternion().setFromUnitVectors(tangents[from], tangents[to]);
      const nn = normals[from].clone().applyQuaternion(q);
      nn.sub(tangents[to].clone().multiplyScalar(nn.dot(tangents[to]))).normalize();
      normals[to] = nn;
    };
    for (let j = k0 + 1; j < n; j++) carry(j - 1, j);
    for (let j = k0 - 1; j >= 0; j--) carry(j + 1, j);

    for (let j = 0; j < n; j++) {
      const { i, s, c, k } = line[j];
      const tgt = tangents[j], nrm = normals[j], bin = tgt.clone().cross(nrm);
      const topEdge = holeOn() ? HOLE_Y - c.y : Y_TOP - c.y;
      const fade = smooth(0, holeOn() ? 1.6 : 0.8, Math.min(c.y - Y_BOTTOM, topEdge));
      const open = 1 - smooth(0.28, 0.46, Math.abs(s));
      const r = DNA_R * (1 + open * 0.9) * (1 - 0.75 * k);
      const th = i * TWIST + k * k * t * 6; // spins faster as it falls in
      const pa = c.clone().add(nrm.clone().multiplyScalar(Math.cos(th) * r)).add(bin.clone().multiplyScalar(Math.sin(th) * r));
      const pb = c.clone().add(nrm.clone().multiplyScalar(Math.cos(th + 2.4) * r)).add(bin.clone().multiplyScalar(Math.sin(th + 2.4) * r));
      place(dnaBalls, 2 * j, pa, 0.045 * fade);
      place(dnaBalls, 2 * j + 1, pb, 0.045 * fade);
      col.setHex(0xa5b4cf).lerp(new THREE.Color(0xc4b5fd), k);
      dnaBalls.setColorAt(2 * j, col);
      col.setHex(0x7f8db0).lerp(new THREE.Color(0xa78bfa), k);
      dnaBalls.setColorAt(2 * j + 1, col);
      if (open > 0.3 || fade <= 0) hideAt(dnaRungs, j);
      else cylinder(dnaRungs, j, pa, pb, 0.017 * fade);
      dnaRungs.setColorAt(j, col.setHex(BASE_COL[seqAt(i)]));
    }
    dnaBalls.count = n * 2;
    dnaRungs.count = n;
  }

  function drawMrna() {
    const readBase = pos - ribArc / STEP;
    const codonStart = Math.floor(readBase / 3) * 3;
    if (codonStart !== lastCodon) { lastCodon = codonStart; pulse = 1; }
    let n = 0;
    for (let j = Math.max(0, Math.ceil(pos - curveLen / STEP)); j <= Math.floor(pos) && n < 480; j++) {
      const arc = (pos - j) * STEP;
      if (arc < 0 || arc > curveLen) continue;
      const reading = j >= codonStart && j < codonStart + 3;
      place(mrnaBeads, n, curve.getPointAt(arc / curveLen), (reading ? 0.06 : 0.035) * smooth(0, 1.2, curveLen - arc));
      col.setHex(BASE_COL[seqAt(j)]);
      if (reading) col.lerp(white, 0.45);
      mrnaBeads.setColorAt(n, col);
      n++;
    }
    mrnaBeads.count = n;
  }

  function drawProtein() {
    const made = Math.max(0, Math.min(PROTEIN_LEN, Math.floor((pos - ribArc / STEP) / 3)));
    const spin = new THREE.Quaternion().setFromAxisAngle(growDir, time * 0.25);
    for (let i = 0; i < made; i++) {
      const age = made - 1 - i + hold * 14;
      const f = smooth(3, 30, age);
      const ext = exit.clone()
        .add(growDir.clone().multiplyScalar(0.05 + Math.min(age, 40) * RES_STEP))
        .add(gPerp1.clone().multiplyScalar(Math.sin(age * 0.9) * 0.03))
        .add(gPerp2.clone().multiplyScalar(Math.cos(age * 0.7) * 0.03));
      const p = ext.lerp(FOLD[i].clone().applyQuaternion(spin).add(foldCenter), f);
      const newest = i === made - 1 && hold === 0;
      place(protBeads, i, p, newest ? 0.075 : 0.052);
      col.setHex(RES_COL[i]);
      if (newest) col.lerp(white, 0.5);
      protBeads.setColorAt(i, col);
    }
    protBeads.count = made;
  }

  const holeCentre = V(0, HOLE_Y, 0);
  function drawBlocks(dt) {
    if (!blockMesh.visible) return;
    for (let k = 0; k < BLOCKS; k++) {
      const b = blocks[k];
      const toP = P.clone().sub(b.p);
      const d = toP.length();
      const toH = holeCentre.clone().sub(b.p);
      const dh = toH.length();
      if (holeOn() && dh < 3.2) {
        // swirl into the black hole
        b.v.add(toH.normalize().multiplyScalar(dt * 2.2 / Math.max(0.3, dh)));
        b.v.add(V(-toH.z, 0, toH.x).multiplyScalar(dt * 1.4));
        if (dh < 0.6) b.life -= dt * 3;
      } else if (d < 2.6) b.v.add(toP.normalize().multiplyScalar(dt * 1.6 / Math.max(0.4, d)));
      else b.v.add(V(rand() - 0.5, rand() - 0.5, rand() - 0.5).multiplyScalar(dt * 0.12));
      b.v.multiplyScalar(d < 2.6 || dh < 3.2 ? 0.985 : 0.995);
      b.p.add(b.v.clone().multiplyScalar(dt));
      if (d < 0.35) b.life -= dt * 4;
      if (b.life <= 0 || b.p.length() > 10 || b.p.y < Y_BOTTOM || b.p.y > HOLE_Y + 1) spawn(b, false);
      place(blockMesh, k, b.p, 0.032 * Math.max(0, b.life));
      blockMesh.setColorAt(k, col.setHex(b.col));
    }
    blockMesh.instanceMatrix.needsUpdate = true;
    if (blockMesh.instanceColor) blockMesh.instanceColor.needsUpdate = true;
  }

  // ---------- Camera ----------
  const camPos = V(0, 0, 11), camTarget = TARGET.clone();
  function desiredCamera() {
    const off = CAM.clone().sub(TARGET);
    const right = off.clone().cross(UP).normalize();
    off.applyAxisAngle(right, pitch);
    off.applyAxisAngle(UP, yaw + orbitAngle);
    off.multiplyScalar(zoom);
    return TARGET.clone().add(off);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      const sdt = dt * speed;
      time += sdt;
      if (Math.floor((pos - ribArc / STEP) / 3) >= PROTEIN_LEN) {
        hold += sdt;
        if (hold > HOLD) { pos = ribArc / STEP - 4; hold = 0; }
      } else pos += sdt * BASES_PER_SEC;
      orbitAngle += sdt * 0.14;
      disk.rotation.z -= sdt * 0.6;
      halo.rotation.z -= sdt * 0.15;
      pulse = Math.max(0, pulse - sdt * 3);
      drawBlocks(sdt);
    }
    drawDna(time);
    drawMrna();
    drawProtein();
    if (ribStyle === 'stylised') {
      const b = 1 + 0.08 * pulse;
      stylSmall.scale.copy(SMALL.r).multiplyScalar(b);
      stylLarge.scale.copy(LARGE.r).multiplyScalar(b);
      for (const g of [stylSmall, stylLarge]) g.children[1].material.opacity = 0.45 + 0.5 * pulse;
    }
    for (const m of [dnaBalls, dnaRungs, mrnaBeads, protBeads]) {
      m.instanceMatrix.needsUpdate = true;
      if (m.instanceColor) m.instanceColor.needsUpdate = true;
    }
    const k = 1 - Math.exp(-dt * 4);
    camPos.lerp(desiredCamera(), k);
    camTarget.lerp(TARGET, k);
    camera.position.copy(camPos);
    camera.lookAt(camTarget);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function resize() {
    const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);

  // ---------- Controls ----------
  const capTitle = document.getElementById('cap-title');
  const capText = document.getElementById('cap-text');
  const RIB_TEXT = {
    simple: 'Simple: today’s two soft, see-through blobs.',
    realistic: 'Realistic: lumpy subunits packed from ribosomal RNA (tan) and proteins (slate), the way space-filling models of real ribosomes look, with a channel the mRNA threads through.',
    stylised: 'Stylised: faceted shapes with glowing edges that pulse each time a codon is read.',
  };
  const DIR_TEXT = {
    down: 'The protein leaves from underneath and grows downwards.',
    up: 'Textbook orientation: the small subunit sits under the mRNA and the large subunit on top, so the protein comes out of the top and grows upwards.',
  };
  function caption() {
    capTitle.textContent = `${ribStyle[0].toUpperCase()}${ribStyle.slice(1)} ribosome · protein grows ${grow}${holeOn() ? ' · black hole' : ''}`;
    capText.textContent = `${RIB_TEXT[ribStyle]} ${DIR_TEXT[grow]}${holeOn() ? ' At the top, the DNA is drawn into a black hole, spinning faster and thinning out as it falls in, mirroring the glowing floor below.' : ''}`;
  }
  function sync() {
    for (const b of document.querySelectorAll('[data-rib]')) b.setAttribute('aria-pressed', String(b.dataset.rib === ribStyle));
    for (const b of document.querySelectorAll('[data-dir]')) b.setAttribute('aria-pressed', String(b.dataset.dir === grow));
    setupRibosome();
    caption();
    try { localStorage.setItem('tower-lab', JSON.stringify({ ribStyle, grow, hole: holeOn() })); } catch (e) { /* not remembered */ }
  }
  for (const b of document.querySelectorAll('[data-rib]')) b.addEventListener('click', () => { ribStyle = b.dataset.rib; sync(); });
  for (const b of document.querySelectorAll('[data-dir]')) b.addEventListener('click', () => { grow = b.dataset.dir; sync(); });

  function bindToggle(id, apply) {
    const btn = document.getElementById(id);
    const set = (on) => { btn.setAttribute('aria-pressed', String(on)); apply(on); caption(); };
    btn.addEventListener('click', () => { set(btn.getAttribute('aria-pressed') !== 'true'); sync(); });
    return set;
  }
  const setHole = bindToggle('t-hole', (on) => { hole.visible = on; holeLight.intensity = on ? 0.9 : 0; });
  const setFloor = bindToggle('t-floor', (on) => { floor.visible = on; floorLight.intensity = on ? 0.9 : 0; });
  const setBlocks = bindToggle('t-blocks', (on) => { blockMesh.visible = on; });

  const playBtn = document.getElementById('play');
  const syncPlay = () => { playBtn.textContent = playing ? 'Pause' : 'Play'; };
  playBtn.addEventListener('click', () => { playing = !playing; syncPlay(); });
  const speeds = [0.5, 1, 2];
  const speedBtn = document.getElementById('speed');
  speedBtn.addEventListener('click', () => { speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length]; speedBtn.textContent = `${speed}×`; });
  document.getElementById('reset').addEventListener('click', () => { yaw = 0; pitch = 0; zoom = 1; });

  const canvas = renderer.domElement;
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    yaw -= (e.clientX - drag.x) * 0.006;
    pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - drag.y) * 0.006));
    drag = { x: e.clientX, y: e.clientY };
  });
  const endDrag = () => (drag = null);
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.4, Math.min(2.2, zoom * Math.exp(e.deltaY * 0.001))); }, { passive: false });

  // Start from "Everything" plus the black hole; restore the viewer's last ribosome and direction.
  try {
    const saved = JSON.parse(localStorage.getItem('tower-lab') || '{}');
    if (['simple', 'realistic', 'stylised'].includes(saved.ribStyle)) ribStyle = saved.ribStyle;
    if (['down', 'up'].includes(saved.grow)) grow = saved.grow;
  } catch (e) { /* defaults */ }
  setHole(true);
  setFloor(true);
  setBlocks(true);
  sync();
  camPos.copy(desiredCamera());
  syncPlay();
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
